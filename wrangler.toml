name = "reco"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Les fichiers statiques (l'appli d'enregistrement) ; le Worker passe en premier pour /api, /v, /f, /t
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/v/*", "/f/*", "/t/*", "/download"]

# Stockage des vidéos (Cloudflare R2, offre gratuite : 10 Go, bande passante gratuite)
[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "reco-videos"

# Secrets (à définir avec `wrangler secret put`, et dans .dev.vars en local) :
#   INVITE_CODE     code à donner à tes potes pour pouvoir enregistrer
#   SESSION_SECRET  longue chaîne aléatoire pour signer les sessions

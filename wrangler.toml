name = "reco"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Static files (the recording app); the Worker runs first for /api, /v, /f, /t
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/v/*", "/f/*", "/t/*", "/download", "/download/*"]

# Video storage (Cloudflare R2, free tier: 10 GB, free egress)
[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "reco-videos"

# Secrets (set with `wrangler secret put`, and in .dev.vars locally):
#   INVITE_CODE     code you give to the people allowed to record
#   SESSION_SECRET  long random string used to sign sessions

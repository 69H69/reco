<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Reco</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
body{margin:0;background:#fdfdfd;color:#0c0a09;font:16px Inter,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;height:100vh}
.c{background:#fff;border:1px solid #e7e5e4;box-shadow:0 8px 24px -12px rgba(12,10,9,.15);border-radius:20px;padding:34px;width:440px}
h1{margin:0 0 6px;font-size:28px}p{color:#78716c;margin:0 0 18px;line-height:1.5}
input{width:100%;box-sizing:border-box;background:#ffffff;border:1px solid #e7e5e4;color:#0c0a09;border-radius:12px;padding:13px;font:inherit}
button{margin-top:16px;width:100%;border:0;border-radius:999px;padding:13px;font:600 16px system-ui;background:#5e51f8;color:#fff;cursor:pointer}
.err{color:#ff8f84;min-height:1.4em;margin-top:10px}
</style></head><body><div class="c">
<h1>Bienvenue sur Reco</h1><p>Colle l'adresse de ton serveur Reco (celle qu'on t'a envoyée), par exemple <b>https://reco.exemple.workers.dev</b></p>
<input id="u" placeholder="https://…" autofocus><button id="b">Continuer</button><div class="err" id="e"></div>
<script>
const s=new URLSearchParams(location.search).get("suggested");if(s)document.getElementById("u").value=s;
async function go(){document.getElementById("e").textContent="";const r=await recoDesktop.setServer(document.getElementById("u").value.trim());if(!r.ok)document.getElementById("e").textContent=r.error}
document.getElementById("b").onclick=go;document.getElementById("u").onkeydown=e=>{if(e.key==="Enter")go()};
</script></div></body></html>

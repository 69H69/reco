<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Que veux-tu partager ?</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
body{margin:0;background:#0b0c10;color:#f5f3ee;font:15px system-ui,sans-serif;padding:22px}
h1{font-size:22px;margin:0 0 4px}p{color:#9a9aa5;margin:0 0 16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{background:#13151b;border:1px solid rgba(255,255,255,.1);color:#f5f3ee;border-radius:10px;padding:8px 16px;cursor:pointer;font:600 14px system-ui}
.tabs button.on{border-color:#ffb547;color:#ffb547}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.s{background:#13151b;border:2px solid transparent;border-radius:14px;padding:10px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.s:hover,.s:focus{border-color:#ffb547;outline:none}.s img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:8px;display:block}
.s span{display:block;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<h1>Que veux-tu partager ?</h1><p>Choisis un écran entier ou une seule fenêtre.</p>
<div class="tabs"><button data-t="screen" class="on">Écrans</button><button data-t="window">Fenêtres</button></div>
<div class="grid" id="g"></div>
<script>
let all=[],tab="screen";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){document.getElementById("g").innerHTML=all.filter(s=>s.screen===(tab==="screen")).map((s,i)=>`<button class="s" data-id="${esc(s.id)}"><img src="${s.thumb}" alt=""><span>${esc(s.screen?(all.filter(x=>x.screen).length>1?"Écran "+(i+1):"Écran entier"):s.name)}</span></button>`).join("")}
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));render()};
document.getElementById("g").onclick=e=>{const b=e.target.closest(".s");if(b)picker.pick(b.dataset.id)};
picker.onSources(d=>{all=d;render()});
</script></body></html>

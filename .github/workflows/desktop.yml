name: Appli de bureau

# Fabrique Reco pour Mac (.dmg, Apple Silicon + Intel) et Windows (.exe), vérifie que l'appli démarre,
# puis publie les fichiers (artefacts ; et une « release » GitHub quand on pousse un tag v*).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Fabriquer (Mac)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Fabriquer (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
      - name: Vérifier que l'appli démarre (Mac)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: node smoke.mjs "dist/mac-arm64/Reco.app/Contents/MacOS/Reco"
      - name: Vérifier que l'appli démarre (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: node smoke.mjs "dist/win-unpacked/Reco.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Reco-${{ runner.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.exe

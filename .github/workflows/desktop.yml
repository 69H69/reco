name: Desktop app

# Builds Reco for Mac (.dmg, Apple Silicon + Intel) and Windows (.exe), checks that the app starts,
# then publishes the files (artifacts; plus a GitHub release when a v* tag is pushed).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # lets the workflow create the GitHub release when a v* tag is pushed

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Bundled Google Drive key (optional GOOGLE_CLIENT_JSON repo secret; otherwise each user imports their own)
        shell: bash
        run: |
          if [ -n "$GOOGLE_CLIENT_JSON" ]; then printf '%s' "$GOOGLE_CLIENT_JSON" > google-client.json; echo "Google key bundled"; else echo "No bundled Google key: users import their own in the app"; fi
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
      - run: node copy-ui.mjs
      - name: Build (Mac)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
      - name: Check the app starts (Mac)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: node smoke.mjs "dist/mac-arm64/Reco.app/Contents/MacOS/Reco"
      - name: Check the app starts (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: node smoke.mjs "dist/win-unpacked/Reco.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Reco-${{ runner.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
